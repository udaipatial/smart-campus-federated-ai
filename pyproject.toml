[project]
name = "smart-campus-federated-ai"
version = "1.0.0"
description = "Privacy-preserving federated edge-AI anomaly detection dashboard for smart campus energy monitoring."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "torch>=2.0.0",
    "matplotlib>=3.7.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# The default PyPI torch wheel bundles ~4 GB of CUDA libraries, which exceeds
# Vercel's function bundle limits. The CPU-only wheel is enough for inference.
torch = { index = "pytorch-cpu" }

[tool.vercel]
# This branch runs the whole FastAPI app as one Function on Vercel: the UI,
# /static, /figures and /api all share an origin, so no CORS or API base URL.
entrypoint = "dashboard.app:app"
